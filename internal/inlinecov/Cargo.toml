[package]
name = "inlinecov"
version = "0.0.0"
edition = "2021"
publish = false
description = "Inline-tree coverage measurement harness. Internal tool, not shipped."

[[bin]]
name = "inlinecov"
path = "src/main.rs"

[dependencies]
unstrip = { path = "../.." }
clap = { version = "4.5", features = ["derive"] }
