[workspace]
members = ["."]

[package]
name = "unstrip"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "Recover symbols, types, and method signatures from stripped Go binaries. Ghidra/IDA/Binary Ninja exporters included."
authors = ["Riven Labs <mohamed@riven-labs.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/riven-labs/unstrip"
homepage = "https://github.com/riven-labs/unstrip"
documentation = "https://docs.rs/unstrip"
readme = "README.md"
keywords = ["reverse-engineering", "go", "binary-analysis", "ghidra", "malware-analysis"]
categories = ["command-line-utilities", "development-tools::debugging", "parser-implementations"]
exclude = [
    "testdata/",
    "mb-corpus/",
    "benches/",
    ".github/",
    ".editorconfig",
    ".gitignore",
]

[[bin]]
name = "unstrip"
path = "src/bin/unstrip.rs"

[lib]
name = "unstrip"
path = "src/lib.rs"

[dependencies]
goblin = { version = "0.8", default-features = false, features = ["std", "elf32", "elf64", "mach32", "mach64", "pe32", "pe64", "endian_fd"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
# Real fixtures live in testdata/. No mocking framework.

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
