[package]
name = "unstrip"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "Recover symbols, types, interfaces, and buildinfo from stripped Go binaries."
authors = ["Riven Labs <mohamed@riven-labs.com>"]
license = "MIT"
repository = "https://github.com/riven-labs/unstrip"
readme = "README.md"
keywords = ["reverse-engineering", "go", "pclntab", "symbols", "binary-analysis"]
categories = ["command-line-utilities", "development-tools::debugging"]

[[bin]]
name = "unstrip"
path = "src/bin/unstrip.rs"

[lib]
name = "unstrip"
path = "src/lib.rs"

[dependencies]
goblin = { version = "0.8", default-features = false, features = ["std", "elf32", "elf64", "mach32", "mach64", "pe32", "pe64", "endian_fd"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
# Real fixtures live in testdata/. No mocking framework.

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
